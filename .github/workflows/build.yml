name: Build & Package

# 发布策略：推 main 时若 tauri.conf.json 的版本尚无对应 vX.Y.Z 标签，
# 自动创建标签并发布正式 Release；版本未变时重推 main 不重复发版（幂等）。
# 也可直接推送 v* 标签，或用 workflow_dispatch 手动触发。

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Frontend & Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests & build
        run: |
          pnpm test
          pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  guard:
    name: Guard version & updater config
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 校验版本一致、标签匹配（标签触发时）、公钥非空、endpoints、action 输入名匹配，
      # 以及签名密钥是否已注入（缺密钥将明确失败，而不是静默跳过）。
      - name: Validate version consistency and updater configuration
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/verify-updater-config.mjs "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

  prepare:
    name: Prepare release tag
    needs: [test, guard]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish and create tag if needed
        id: decide
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 直接推送 v* 标签：按该标签发版
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push detected: ${GITHUB_REF_NAME}"
            exit 0
          fi

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          echo "App version: ${VERSION}; target tag: ${TAG}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists."
            # 标签存在但 Release 可能缺失：以 latest.json 是否可取判断是否已发布
            if curl -fsSL -o /dev/null "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json"; then
              echo "Release for ${TAG} already published; nothing to do."
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag exists but no published release found; will (re)publish."
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed tag ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.label }})
    needs: [test, guard, prepare]
    if: needs.prepare.outputs.should_publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rust_target: ""
            tauri_args: ""
            artifact_name: git-hunk-windows-x64
          - label: macOS Apple Silicon
            os: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            artifact_name: git-hunk-macos-arm64
          - label: Linux x64
            os: ubuntu-22.04
            rust_target: ""
            tauri_args: --bundles deb,appimage
            artifact_name: git-hunk-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact_name }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action v1：创建/更新 Release，自动合并 latest.json 并上传 .sig。
      # 注意：v1 输入名为 uploadUpdaterJson / uploadUpdaterSignatures 等（与 v0 不兼容）。
      - name: Build & publish (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.tauri_args }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: git-hunk ${{ needs.prepare.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  verify:
    name: Verify published update feed
    needs: [prepare, package]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Assert latest.json contains Windows & Linux entries
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          ok=""
          for i in $(seq 1 10); do
            echo "Attempt ${i}: fetching ${URL}"
            if curl -fsSL "$URL" -o latest.json; then ok="1"; break; fi
            sleep 10
          done
          if [ -z "$ok" ]; then echo "latest.json not reachable"; exit 1; fi
          echo "=== latest.json ==="
          cat latest.json
          node -e '
            const fs = require("node:fs");
            const j = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const keys = Object.keys(j.platforms || {});
            console.log("version:", j.version, "platforms:", keys.join(", "));
            if (!j.version) { console.error("latest.json missing version"); process.exit(1); }
            for (const k of ["windows-x86_64", "linux-x86_64"]) {
              if (!j.platforms || !j.platforms[k] || !j.platforms[k].url || !j.platforms[k].signature) {
                console.error("latest.json missing valid entry for " + k);
                process.exit(1);
              }
            }
            console.log("latest.json OK");
          '
